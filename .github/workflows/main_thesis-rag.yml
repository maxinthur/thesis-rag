name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4226F7F96EDC4F42A73D4F8CFB2EA820 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C28A69ED243E491492526A7F2C4EF21D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_97C7A5E63C5C4DA6AB0A91D4674481BA }}

      - name: Deploy latest image to Container App
        run: |
          az containerapp update \
            --name thesis-rag \
            --resource-group thesis-rag-rg \
            --image thesisragcr.azurecr.io/thesis-rag:latest